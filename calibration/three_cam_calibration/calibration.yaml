description: Accepted 3-camera calibration of the UR5e setup (calibrated 2026-10-20).
convention: T_A_B = pose of frame B in frame A, p_A = T_A_B @ p_B. Camera frames are
  the RealSense colour optical frames at 640x480.
robot_frames: base = UR base. ee = UR TCP with pendant TCP 'TCP' (zero offset = tool
  flange), Feature 'Base'.
how_to_use: {fixed cameras: p_base = T_base_cameraN @ p_cameraN, wrist camera: p_base
    = T_base_ee(current TCP pose) @ T_ee_camera2 @ p_camera2}
board: {squares_x: 7, squares_y: 5, square_length_m: 0.0234, marker_length_m: 0.01685,
  dictionary: 6X6_250, note: 'printed at 93.6% scale: 7 squares = 164 mm, 5 squares
    = 117 mm'}
cameras:
  camera1:
    serial: '337322072205'
    mount: base-mounted (fixed)
    transform: T_base_camera1
    file: T_base_camera1.npy
    matrix:
    - [0.999370840917486, -0.030368784887454026, 0.018321005112606516, -0.02702810446019823]
    - [-0.028102188010140545, -0.3628747488261465, 0.9314140774614713, 0.19920425205970427]
    - [-0.02163768363109423, -0.9313429301652644, -0.36349987218465424, 0.05413937140109983]
